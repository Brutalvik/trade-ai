<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-label="TRADING//RUST">
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72f7ff"/>
      <stop offset=".48" stop-color="#00c9ed"/>
      <stop offset="1" stop-color="#0069ef"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#04e5f6"/>
      <stop offset=".45" stop-color="#00aef0"/>
      <stop offset="1" stop-color="#0069eb"/>
    </linearGradient>
    <radialGradient id="shine">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#e8fdff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#9ffbff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#9ffbff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="leftShape"><path d="M24 490 506 30V490Z"/></clipPath>
    <clipPath id="rightShape"><path d="M530 30H1056L530 490Z"/></clipPath>
  </defs>
  <path d="M24 490 506 30V490Z" fill="url(#left)"/>
  <path d="M530 30H1056L530 490Z" fill="url(#right)"/>
  <!-- the glossy streaks: along the left shape's slope, and along the right shape's top edge -->
  <g clip-path="url(#leftShape)">
    <ellipse cx="330" cy="225" rx="170" ry="34" fill="url(#glow)" transform="rotate(-43.67 330 225)"/>
    <ellipse cx="338" cy="216" rx="96" ry="7" fill="url(#shine)" transform="rotate(-43.67 338 216)"/>
  </g>
  <g clip-path="url(#rightShape)">
    <ellipse cx="760" cy="62" rx="230" ry="40" fill="url(#glow)"/>
    <ellipse cx="806" cy="50" rx="120" ry="5" fill="url(#shine)"/>
  </g>
</svg>
